plugins { id 'com.android.application' }

android {
    namespace 'com.ourforever.love'
    compileSdk 36
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.ourforever.love'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/loveAssets'))
}

// Package the original files on every build, so the app and website stay in sync.
tasks.register('syncLoveAssets', Sync) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', 'styles.css', 'icons.css', 'script.js'
    }
    into layout.buildDirectory.dir('generated/loveAssets')
}
tasks.named('preBuild').configure { dependsOn 'syncLoveAssets' }

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.activity:activity:1.10.1'
}
